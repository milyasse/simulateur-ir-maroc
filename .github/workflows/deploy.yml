name: Tests et déploiement GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Tests des calculs (barèmes et tableau du PLF)
        run: npm test

      - name: Installer les dépendances
        run: npm install --no-audit --no-fund

      - name: Vérification des types (informative)
        continue-on-error: true
        run: npm run typecheck

      - name: Construire l'application
        env:
          # https://<utilisateur>.github.io/<depot>/ ; "/" si le dépôt s'appelle <utilisateur>.github.io
          BASE_PATH: ${{ endsWith(github.event.repository.name, '.github.io') && '/' || format('/{0}/', github.event.repository.name) }}
        run: |
          npm run build
          cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
